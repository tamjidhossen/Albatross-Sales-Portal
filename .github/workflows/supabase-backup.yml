name: Supabase Daily Automated Backup

on:
  schedule:
    # Runs everyday at 21:00 UTC (03:00 AM Bangladesh Standard Time)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Backup Directory
        run: |
          DATE_STR=$(date +'%Y-%m-%d_%H%M%S')
          echo "BACKUP_DIR=backups/$DATE_STR" >> $GITHUB_ENV
          mkdir -p backups/$DATE_STR

      - name: Export Supabase Tables via REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://sximqzpcrwodvcgkpevb.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_nVUTv5-6-XQg58T5aTHDWQ_hBgLxlXR' }}
        run: |
          echo "Exporting daily sessions..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/daily_sessions?select=*" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" > $BACKUP_DIR/daily_sessions.json

          echo "Exporting daily inventory..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/daily_inventory?select=*" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" > $BACKUP_DIR/daily_inventory.json

          echo "Exporting daily expenses..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/daily_expenses?select=*" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" > $BACKUP_DIR/daily_expenses.json

          echo "Exporting daily payouts..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/daily_payouts?select=*" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" > $BACKUP_DIR/daily_payouts.json

          echo "Exporting products..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/products?select=*" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" > $BACKUP_DIR/products.json

          echo "Exporting audit trail..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/audit_logs?select=*" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" > $BACKUP_DIR/audit_logs.json

          echo "Backup files generated:"
          ls -lh $BACKUP_DIR

      - name: Commit and Push to Private Backup Branch
        run: |
          git config --global user.name "Albatross Backup Bot"
          git config --global user.email "backup-bot@albatross.com"
          
          # Switch or create dedicated backups branch
          git checkout -b backups 2>/dev/null || git checkout backups
          git add backups/
          git commit -m "Automated DB Backup - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin backups || echo "Push skipped if remote branch not yet configured"
