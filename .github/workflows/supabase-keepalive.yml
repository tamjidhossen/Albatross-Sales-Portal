name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 6 hours to prevent Supabase Free Tier auto-pause after 7 days of inactivity
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://sximqzpcrwodvcgkpevb.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_nVUTv5-6-XQg58T5aTHDWQ_hBgLxlXR' }}
        run: |
          echo "Sending keep-alive query to Supabase products table..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Supabase HTTP status response: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase project pinged successfully. Free tier pause prevented!"
          else
            echo "⚠️ Warning: Ping received status $HTTP_CODE. Please verify Supabase URL & keys."
            exit 1
          fi
